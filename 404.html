<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cassette introuvable — SOMEDAY</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    :root { --black:#080808; --white:#e8e4dc; --dim:#8a857d; --accent:#c8392b; --accent-text:#e2564a; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at center, #1a1410 0%, var(--black) 70%);
      color: var(--white); font-family: 'IBM Plex Mono', monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    }
    .code {
      font-family: 'Bebas Neue', sans-serif; font-size: clamp(6rem, 30vw, 16rem);
      line-height: 0.88; letter-spacing: 0.02em; position: relative;
    }
    .code::before {
      content: '404'; position: absolute; inset: 0; color: var(--accent);
      clip-path: polygon(0 30%, 100% 30%, 100% 38%, 0 38%); transform: translateX(-3px); opacity: 0.5;
      animation: glitch 6s infinite step-end;
    }
    @keyframes glitch {
      0%, 92%, 100% { opacity: 0; transform: translateX(0); }
      93% { opacity: 0.5; transform: translateX(-4px); clip-path: polygon(0 20%, 100% 20%, 100% 28%, 0 28%); }
      94% { opacity: 0.4; transform: translateX(3px); clip-path: polygon(0 55%, 100% 55%, 100% 60%, 0 60%); }
      95% { opacity: 0; }
    }
    h1 { font-weight: 400; font-size: clamp(0.8rem, 2.4vw, 1rem); letter-spacing: 0.2em; font-style: italic; color: var(--dim); margin-top: 1.5rem; }
    nav { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; margin-top: 2.5rem; }
    a { color: var(--white); font-size: 0.75rem; letter-spacing: 0.15em; text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2); padding: 0.7rem 1.2rem; transition: border-color 0.2s; }
    a:hover { border-color: var(--accent); }
    a:focus-visible { outline: 1px solid var(--accent-text); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .code::before { animation: none; opacity: 0; } a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Cassette introuvable. Elle n'est plus sur l'étagère.</h1>
    <nav>
      <a href="/">← Accueil</a>
      <a href="/#episodes">Les épisodes</a>
      <a href="/boutique.html">Boutique</a>
    </nav>
  </main>
</body>
</html>
