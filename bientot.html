<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prochainement · SOMEDAY</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #080808; --white: #e8e4dc; --dim: #6b6660; --accent: #c8392b; }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; font-weight: 300; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }

    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.035; pointer-events: none; z-index: 1000; }
    body::after { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); pointer-events: none; z-index: 999; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 2rem; background: linear-gradient(to bottom, rgba(8,8,8,0.95), transparent); }
    .nav-back { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.25em; color: var(--dim); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
    .nav-back:hover { color: var(--white); }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.3em; color: var(--white); text-decoration: none; opacity: 0.5; }

    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8rem 2rem 4rem; }

    .cassette {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 4rem;
      color: rgba(255,255,255,0.06);
      margin-bottom: 3rem;
      animation: blink 3s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.06; }
      50% { opacity: 0.15; }
    }

    .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 7rem);
      line-height: 0.9;
      letter-spacing: 0.03em;
      color: var(--white);
      margin-bottom: 2rem;
    }

    .subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      font-style: italic;
      max-width: 440px;
      line-height: 1.8;
      margin-bottom: 3rem;
    }

    .tape-divider { display: flex; align-items: center; gap: 1rem; margin: 0 auto 3rem; width: 100%; max-width: 320px; }
    .tape-line { height: 1px; flex: 1; background: rgba(255,255,255,0.05); }
    .tape-icon { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--dim); letter-spacing: 0.2em; }

    .cta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--accent);
      padding: 0.85rem 1.75rem;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.85; }

    footer { padding: 3rem 2rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
    .footer-nav { display: flex; justify-content: center; gap: 2rem; margin-top: 1rem; }
    .footer-nav a { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; letter-spacing: 0.25em; color: var(--dim); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
    .footer-nav a:hover { color: var(--white); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-back">← Tous les épisodes</a>
    <a href="index.html" class="nav-logo">SOMEDAY</a>
  </nav>

  <main class="main">
    <div class="cassette">▶</div>
    <p class="label">Épisode en préparation</p>
    <h1 class="title">Prochainement</h1>
    <p class="subtitle">
      La cassette est en cours d'enregistrement.<br />
      Cet épisode sera disponible prochainement<br />
      sur la chaîne SOMEDAY.
    </p>

    <div class="tape-divider">
      <div class="tape-line"></div>
      <span class="tape-icon">— — —</span>
      <div class="tape-line"></div>
    </div>

    <a href="index.html" class="cta">← Retour aux épisodes</a>
  </main>

  <footer>
    <a href="https://somedayvhs.github.io/someday-production/index.html" style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:0.3em;color:var(--dim);text-decoration:none;display:inline-block;margin-bottom:0.75rem;transition:color 0.2s;" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='var(--dim)'">SOMEDAY PRODUCTION</a>
    <nav class="footer-nav">
      <a href="index.html">← Accueil</a>
      <a href="index.html#episodes">Tous les épisodes</a>
    </nav>
  </footer>

</body>
</html>
